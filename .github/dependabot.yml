# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    # A new release is only picked up after it has been public for a while, so that a compromised
    # or broken release can be noticed and yanked first. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      mittwald-api:
        patterns:
          - "github.com/mittwald/api-client-go"

  # Keeps the commit SHAs of the actions used in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Keeps the digest-pinned base images in the Dockerfile current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
